# Every improvement round is validated with the same command. This workflow
# covers feature branches and pull requests; deploy-pages.yml covers main.
name: Verifiera förbättringsrunda

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unit checks for the ten-minute Neon Shift rotation, TypeScript,
      # all five translation columns and a production build.
      - name: Verify round
        run: npm run verify:round
