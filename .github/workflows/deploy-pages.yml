name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Delay to avoid deployment race
        if: github.event_name == 'push'
        run: sleep 90

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail before deploying instead of shipping a broken bundle. `check`
      # bundles typecheck, the translation-table guard and the production build.
      - name: Check (types + translations + build)
        run: npm run check

      - name: Unit tests (level, difficulty, perks, quality, daily, telemetry)
        run: npm run test:units

      - name: Start dev server for browser tests
        run: |
          npm run dev -- --host 0.0.0.0 > /tmp/shadow-paw-dev.log 2>&1 &
          echo $! > /tmp/shadow-paw-dev.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ > /dev/null; then echo "dev server ready"; exit 0; fi
            sleep 1
          done
          cat /tmp/shadow-paw-dev.log
          exit 1

      # Portable Chromium comes from @sparticuz/chromium; no Windows Chrome path.
      - name: Gameplay smoke test
        run: npm run test:smoke

      - name: UI smoke test (pause, results, game over, shop, 5 languages / RTL)
        run: npm run test:ui

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/shadow-paw-dev.pid ]; then kill "$(cat /tmp/shadow-paw-dev.pid)" || true; fi
          cat /tmp/shadow-paw-dev.log || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
