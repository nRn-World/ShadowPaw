<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060817" />
    <meta name="description" content="Shadow Paw – a fast neon platform adventure. Rescue Jerry, build your streak and clear ever harder levels." />
    <title>Shadow Paw: Neon Mission</title>

    <!-- Installable app + link previews -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shadow Paw" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shadow Paw" />
    <meta property="og:title" content="Shadow Paw: Neon Mission" />
    <meta property="og:description" content="Run, jump and shoot through 40+ neon chapters. Rescue Jerry, build your streak and beat the bosses." />
    <meta property="og:image" content="https://shadow-paw-game.vercel.app/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Shadow Paw: Neon Mission" />
    <meta name="twitter:description" content="A fast neon platform adventure. Rescue Jerry, build your streak and beat the bosses." />
    <meta name="twitter:image" content="https://shadow-paw-game.vercel.app/icon-512.png" />

    <link rel="preload" href="./city-bg.jpg" as="image" />

    <!-- Self-hosted fonts: no CDN dependency, so the UI never falls back to
         unstyled system fonts or renders icon ligatures as plain text. -->
    <link rel="preload" href="./fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="bg-[#060817] text-white antialiased">
    <div id="root" class="w-full h-screen"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
