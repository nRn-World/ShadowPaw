  <path d="M160 198 L168 124 L214 176 Z" fill="#e88fb4" opacity="0.9"/>
  <path d="M352 198 L344 124 L298 176 Z" fill="#e88fb4" opacity="0.9"/>

  <path d="M256 130 C338 130 392 186 392 272 C392 360 336 424 256 424 C176 424 120 360 120 272 C120 186 174 130 256 130 Z" fill="url(#sp-fur)" stroke="#16255e" stroke-width="8"/>
  <ellipse cx="190" cy="220" rx="46" ry="28" fill="#ffffff" opacity="0.08"/>

  <g filter="url(#sp-eyeglow)">
