<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Shadow Paw">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#16294f"/>
      <stop offset="0.55" stop-color="#0a1226"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="sp-halo" cx="50%" cy="92%" r="62%">
      <stop offset="0" stop-color="#2bee79" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#2bee79" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#2bee79" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp-fur" x1="0.18" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#7f9dff"/>
      <stop offset="0.45" stop-color="#4a6cf0"/>
      <stop offset="1" stop-color="#2a46b8"/>
    </linearGradient>
    <filter id="sp-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="sp-eyeglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sp-bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sp-halo)"/>
  <ellipse cx="256" cy="372" rx="160" ry="46" fill="#2bee79" opacity="0.2" filter="url(#sp-soft)"/>

